[package]
name = "bcc"
version = "0.1.0"
edition = "2021"
description = "Backend Compiler - YAML to Elixir skeleton generator with extract and trace"

[lib]
name = "bcc"
path = "src/lib.rs"

[[bin]]
name = "bcc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-elixir = "0.3"
tree-sitter-typescript = "0.23"
tree-sitter-php = "0.24"
tree-sitter-rust = "0.23"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "1"

[features]
default = []
bdd = []

[dev-dependencies]
tempfile = "3"
