[package]
name = "bcc"
version = "0.1.0"
edition = "2021"
description = "Backend Compiler - YAML to Elixir skeleton generator with extract and trace"

[[bin]]
name = "bcc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tree-sitter = "0.24"
tree-sitter-elixir = "0.3"
tree-sitter-typescript = "0.23"
