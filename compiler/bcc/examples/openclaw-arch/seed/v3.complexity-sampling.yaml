version: v1
kind: complexity_sampling
intent: L0-L3 complexity baseline sampling for gate tuning
formula: "complexity = rules*1 + max_depth*3 + branches*2"
scenarios:
  - scenario: l0_crud
    rules: 4
    max_depth: 1
    branches: 1
    complexity: 9
  - scenario: l1_rules
    rules: 8
    max_depth: 2
    branches: 2
    complexity: 18
  - scenario: l2_rules_combo
    rules: 14
    max_depth: 3
    branches: 5
    complexity: 33
  - scenario: l3_use_case
    rules: 18
    max_depth: 5
    branches: 10
    complexity: 53
thresholds:
  warn: 30
  strict: 50
