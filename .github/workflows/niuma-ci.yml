name: niuma CI

on:
  push:
    branches: [master]
    paths:
      - 'automation/niuma/**'
      - '.github/workflows/niuma-ci.yml'
  pull_request:
    paths:
      - 'automation/niuma/**'
      - '.github/workflows/niuma-ci.yml'

defaults:
  run:
    working-directory: automation/niuma

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: automation/niuma/go.sum

      - name: Tidy modules
        run: go mod tidy

      - name: Contract Compile Check (fail-fast)
        run: |
          go build ./pkg/control/...
          go test -c ./tests/integration -o /dev/null

      - name: Unit Tests
        run: go test ./...

      - name: BDD Tests
        run: go test -tags bdd ./...

      - name: Build
        run: go build -o niuma ./cmd/niuma

      - name: Verify binary
        run: ./niuma --help

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: automation/niuma/go.sum

      - name: Tidy modules
        run: go mod tidy

      - name: Integration Tests
        env:
          NIUMA_TEST_REPO: biantaishabi2/Cli-niuma-test
          NIUMA_TEST_TOKEN: ${{ secrets.NIUMA_TEST_TOKEN || secrets.NIUMA_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -tags integration -v ./...
