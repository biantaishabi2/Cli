name: niuma CI

on:
  push:
    branches: [master]
    paths:
      - 'automation/niuma/**'
  pull_request:
    paths:
      - 'automation/niuma/**'

defaults:
  run:
    working-directory: automation/niuma

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: automation/niuma/go.sum

      - name: Tidy modules
        run: go mod tidy

      - name: Unit Tests
        run: go test ./...

      - name: BDD Tests
        run: go test -tags bdd ./...

      - name: Build
        run: go build -o niuma ./cmd/niuma

      - name: Verify binary
        run: ./niuma --help

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: automation/niuma/go.sum

      - name: Tidy modules
        run: go mod tidy

      - name: Integration Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -tags integration -v ./...
