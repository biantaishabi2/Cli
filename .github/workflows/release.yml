name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build all workspace members
        run: cargo build --release

      - name: Prepare package variables
        id: vars
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "taskctl_asset=taskctl-${VERSION}-${TARGET}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "bcc_asset=bcc-${VERSION}-${TARGET}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create tarballs
        shell: bash
        run: |
          mkdir -p dist
          # taskctl
          cp target/release/taskctl dist/taskctl
          chmod +x dist/taskctl
          tar -C dist -czf "dist/${{ steps.vars.outputs.taskctl_asset }}" taskctl
          # bcc
          cp target/release/bcc dist/bcc
          chmod +x dist/bcc
          tar -C dist -czf "dist/${{ steps.vars.outputs.bcc_asset }}" bcc

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          for asset in "${{ steps.vars.outputs.taskctl_asset }}" "${{ steps.vars.outputs.bcc_asset }}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" > "${asset}.sha256"
            else
              shasum -a 256 "$asset" > "${asset}.sha256"
            fi
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.vars.outputs.taskctl_asset }}
            dist/${{ steps.vars.outputs.taskctl_asset }}.sha256
            dist/${{ steps.vars.outputs.bcc_asset }}
            dist/${{ steps.vars.outputs.bcc_asset }}.sha256
