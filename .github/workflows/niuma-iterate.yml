name: niuma - Iterate

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: niuma-iterate-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # AI 自审不通过 → 自动迭代
  iterate-from-review:
    runs-on: self-hosted
    if: >
      github.event_name == 'issues' &&
      github.event.label.name == 'bot:pr-needs-fix'
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NIUMA_PAT }}
          fetch-depth: 0  # 获取完整历史，确保可以 fetch 远程分支重建 worktree

      - name: Build niuma from current commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          (
            cd automation/niuma
            go build -o "$GITHUB_WORKSPACE/.tmp/niuma" ./cmd/niuma
          )
          echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"

      - name: Find PR Number
        id: find_pr
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100&sort=created&direction=desc" \
            --jq '.[].body | select(contains("BOT:PR_CREATED"))' | grep -Eo 'pr=[0-9]+' | sed 's/pr=//' | head -1)
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::未在 issue #${ISSUE_NUMBER} 的评论中找到 PR 号"
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Iterate on Review
        if: steps.find_pr.outputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          "$NIUMA_BIN" iterate \
            --repo "$REPO" \
            --issue "$ISSUE_NUMBER" \
            --pr "$PR_NUMBER" \
            --repo-dir "$WORKSPACE"

      - name: Run PR Gate
        id: gate
        if: steps.find_pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          ./.github/scripts/niuma-test-gate.sh "$PR_NUMBER"

      - name: Keep Needs-Fix On Gate Failure
        if: steps.gate.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label bot:pr-created --add-label bot:pr-needs-fix || \
            gh issue edit "$ISSUE_NUMBER" --add-label bot:pr-needs-fix
          gh issue comment "$ISSUE_NUMBER" --body "## ❌ Gate 未通过\n\n迭代后自动测试门禁失败，状态保持为 \`bot:pr-needs-fix\`，请继续修复。"
          exit 1

  # 人工 PR review changes_requested → 迭代
  iterate-from-human:
    runs-on: self-hosted
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested'
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NIUMA_PAT }}
          fetch-depth: 0  # 获取完整历史，确保可以 fetch 远程分支重建 worktree

      - name: Build niuma from current commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          (
            cd automation/niuma
            go build -o "$GITHUB_WORKSPACE/.tmp/niuma" ./cmd/niuma
          )
          echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"

      - name: Extract Issue Number from PR
        id: extract
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(gh pr view "$PR_NUMBER" --json body -q '.body')
          ISSUE_NUMBER=$(echo "$BODY" | grep -Eo 'Closes #[0-9]+' | sed 's/Closes #//' | head -1)
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Iterate on Review
        if: steps.extract.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          "$NIUMA_BIN" iterate \
            --repo "$REPO" \
            --issue "$ISSUE_NUMBER" \
            --pr "$PR_NUMBER" \
            --repo-dir "$WORKSPACE"

      - name: Run PR Gate
        id: gate_human
        if: steps.extract.outputs.issue_number != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
        run: |
          ./.github/scripts/niuma-test-gate.sh "$PR_NUMBER"

      - name: Keep Needs-Fix On Gate Failure
        if: steps.gate_human.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label bot:pr-created --add-label bot:pr-needs-fix || \
            gh issue edit "$ISSUE_NUMBER" --add-label bot:pr-needs-fix
          gh issue comment "$ISSUE_NUMBER" --body "## ❌ Gate 未通过\n\n根据人工 review 迭代后门禁失败，状态保持为 \`bot:pr-needs-fix\`，请继续修复。"
          exit 1
