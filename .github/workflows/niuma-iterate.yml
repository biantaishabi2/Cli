name: niuma - Iterate

on:
  pull_request_review:
    types: [submitted]

defaults:
  run:
    working-directory: automation/niuma

concurrency:
  group: niuma-iterate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  iterate:
    runs-on: self-hosted
    if: github.event.review.state == 'changes_requested'
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: automation/niuma/go.sum

      - name: Build niuma
        run: go build -o niuma ./cmd/niuma

      - name: Extract Issue Number from PR
        id: extract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BODY=$(gh pr view $PR_NUMBER --json body -q '.body')
          ISSUE_NUMBER=$(echo "$BODY" | grep -oP 'Closes #\K\d+' | head -1)
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Iterate on Review
        if: steps.extract.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./niuma iterate \
            --repo ${{ github.repository }} \
            --issue ${{ steps.extract.outputs.issue_number }} \
            --pr ${{ steps.extract.outputs.pr_number }} \
            --repo-dir ${{ github.workspace }}

      - name: AI Self-Review After Iterate
        if: steps.extract.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./niuma review \
            --repo ${{ github.repository }} \
            --issue ${{ steps.extract.outputs.issue_number }} \
            --pr ${{ steps.extract.outputs.pr_number }}
