name: niuma - Iterate

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

defaults:
  run:
    working-directory: automation/niuma

concurrency:
  group: niuma-iterate-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # AI 自审不通过 → 自动迭代
  iterate-from-review:
    runs-on: self-hosted
    if: >
      github.event_name == 'issues' &&
      github.event.label.name == 'bot:pr-needs-fix'
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: automation/niuma/go.sum

      - name: Build niuma
        run: go build -o niuma ./cmd/niuma

      - name: Find PR Number
        id: find_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=${{ github.event.issue.number }}
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/issues/${ISSUE}/comments" \
            --jq '.[].body | select(contains("BOT:PR_CREATED"))' | grep -oP 'pr=\K\d+' | tail -1)
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Iterate on Review
        if: steps.find_pr.outputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./niuma iterate \
            --repo ${{ github.repository }} \
            --issue ${{ github.event.issue.number }} \
            --pr ${{ steps.find_pr.outputs.pr_number }} \
            --repo-dir ${{ github.workspace }}

  # 人工 PR review changes_requested → 迭代
  iterate-from-human:
    runs-on: self-hosted
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested'
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: automation/niuma/go.sum

      - name: Build niuma
        run: go build -o niuma ./cmd/niuma

      - name: Extract Issue Number from PR
        id: extract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BODY=$(gh pr view $PR_NUMBER --json body -q '.body')
          ISSUE_NUMBER=$(echo "$BODY" | grep -oP 'Closes #\K\d+' | head -1)
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Iterate on Review
        if: steps.extract.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./niuma iterate \
            --repo ${{ github.repository }} \
            --issue ${{ steps.extract.outputs.issue_number }} \
            --pr ${{ steps.extract.outputs.pr_number }} \
            --repo-dir ${{ github.workspace }}
