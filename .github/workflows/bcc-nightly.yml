name: BCC Nightly Regression

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: bcc nightly (parity + dual-chain smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build bcc release binary
        run: cargo build --release -p bcc

      - name: Install parity script deps
        run: npm --prefix compiler/bcc/scripts ci

      - name: Run TS/Rust parity on synthetic TS project
        run: |
          TMP_PROJECT="$(mktemp -d)"
          mkdir -p "$TMP_PROJECT/src/api" "$TMP_PROJECT/src/lib" "$TMP_PROJECT/docs/backend-trace/artifacts"
          cat >"$TMP_PROJECT/src/lib/user.ts" <<'TS'
          export function formatName(name: string): string {
            return name.trim().toUpperCase();
          }
          TS
          cat >"$TMP_PROJECT/src/api/handler.ts" <<'TS'
          import { formatName } from "../lib/user";

          export async function handle(input: string) {
            return formatName(input);
          }
          TS
          node compiler/bcc/scripts/parity_ts_rust.mjs \
            --project-root "$TMP_PROJECT" \
            --bcc-bin ./target/release/bcc \
            --out "$TMP_PROJECT/docs/backend-trace/artifacts/ts-rust-parity.json" \
            --strict
          mkdir -p compiler/bcc/docs/nightly-artifacts
          cp "$TMP_PROJECT/docs/backend-trace/artifacts/ts-rust-parity.json" compiler/bcc/docs/nightly-artifacts/ts-rust-parity.json

      - name: Run bcc cli smoke integration tests
        run: cargo test -p bcc --test cli_arch_bdd

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcc-nightly-artifacts
          path: compiler/bcc/docs/nightly-artifacts
          if-no-files-found: error
