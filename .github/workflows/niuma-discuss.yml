name: niuma - Discussion Check

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分钟检查收敛

defaults:
  run:
    working-directory: automation/niuma

concurrency:
  group: niuma-discuss-${{ github.event.issue.number || 'schedule' }}
  cancel-in-progress: true

jobs:
  discussion-check:
    runs-on: self-hosted
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null) ||
      github.event_name == 'schedule'
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: automation/niuma/go.sum

      - name: Build niuma
        run: go build -o niuma ./cmd/niuma

      # 事件驱动：issue 评论触发
      - name: Check Discussion (event)
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "bot:needs-discussion"; then
            ./niuma plan-final \
              --repo ${{ github.repository }} \
              --issue ${{ github.event.issue.number }} || true
          fi

      # 定时扫描：检查所有讨论中的 issue
      - name: Check Discussion (scheduled)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES=$(gh issue list --label "bot:needs-discussion" --json number -q '.[].number')
          for ISSUE in $ISSUES; do
            echo "检查 issue #$ISSUE 讨论收敛..."
            ./niuma plan-final \
              --repo ${{ github.repository }} \
              --issue $ISSUE || true
          done
