name: niuma - Discussion Check

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue 编号"
        required: true
        type: number
      discussion_mode:
        description: "讨论模式（consolidate|debate_ab）"
        required: false
        default: "consolidate"
        type: choice
        options:
          - consolidate
          - debate_ab
      max_discussion_rounds:
        description: "最大讨论轮次（1-20）"
        required: false
        default: 5
        type: number
      visible_round_interval:
        description: "可见评论轮次间隔"
        required: false
        default: 1
        type: number
      visible_only_on_diff:
        description: "仅差异变化时可见评论"
        required: false
        default: true
        type: boolean

jobs:
  discussion-check:
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: niuma-discuss-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.issue) || format('{0}', github.event.issue.number) }}
      cancel-in-progress: true
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.issue.pull_request == null &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'bot:needs-discussion') ||
        (github.event_name == 'issue_comment' &&
          !endsWith(github.actor, '[bot]') &&
          !contains(github.event.comment.body || '', '<!-- BOT:'))
      ))
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build niuma from current commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          (
            cd automation/niuma
            go build -o "$GITHUB_WORKSPACE/.tmp/niuma" ./cmd/niuma
          )
          echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"

      # 事件驱动启动一次 discuss，后续轮次在进程内循环推进
      - name: Check Discussion
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER_INPUT: ${{ inputs.issue }}
          MAX_DISCUSSION_ROUNDS: ${{ inputs.max_discussion_rounds }}
          NIUMA_DISCUSSION_MODE: ${{ inputs.discussion_mode }}
          NIUMA_VISIBLE_ROUND_INTERVAL: ${{ inputs.visible_round_interval }}
          NIUMA_VISIBLE_ONLY_ON_DIFF: ${{ inputs.visible_only_on_diff }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$ISSUE_NUMBER_INPUT"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "bot:needs-discussion"; then
            EXTRA_ARGS=()
            if [ -n "$MAX_DISCUSSION_ROUNDS" ]; then
              EXTRA_ARGS+=(--max-discussion-rounds "$MAX_DISCUSSION_ROUNDS")
            fi
            "$NIUMA_BIN" discuss \
              --repo "$REPO" \
              --issue "$ISSUE_NUMBER" \
              "${EXTRA_ARGS[@]}"
          fi
