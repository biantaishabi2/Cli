name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  bot-label-guard:
    name: bot label guard + niuma gate tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce managed bot label operations
        run: .github/scripts/check-bot-label-ops.sh

      - name: Run niuma gate unit tests
        run: .github/scripts/tests/niuma-test-gate.unit.sh

      - name: Run niuma gate integration tests
        run: .github/scripts/tests/niuma-test-gate.integration.sh

      - name: Run niuma gate bdd tests
        run: .github/scripts/tests/niuma-test-gate.bdd.sh

  taskctl:
    name: taskctl test (ubuntu)
    runs-on: ubuntu-latest
    needs: bot-label-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p taskctl

      - name: Build release binary
        run: cargo build --release -p taskctl

      - name: Verify binary help
        run: ./target/release/taskctl --help

  bcc:
    name: bcc test (ubuntu)
    runs-on: ubuntu-latest
    needs: bot-label-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p bcc

      - name: Verify bcc help
        run: |
          ./target/release/bcc --help
          ./target/release/bcc --version

      - name: Verify compile dry-run
        run: |
          ./target/release/bcc compile compiler/bcc/fixtures/session_service.yaml --dry-run 2>&1 | grep "module: SessionService"

      - name: Verify extract
        run: |
          ./target/release/bcc extract compiler/bcc/fixtures/sample_service.ex --mode ast | grep '"language": "elixir"'

      - name: Verify trace
        run: |
          ./target/release/bcc trace status compiler/bcc/fixtures/trace_project/src compiler/bcc/fixtures/trace_project/docs/backend-trace/files/src | grep "总文件: 3"

      - name: Run bcc smoke integration tests
        run: cargo test -p bcc --test cli_arch_bdd

      # Golden 回归先并入 bcc 主测试任务；记录连续 10 次耗时并计算 P95，超过阈值时给出拆分提示。
      - name: Run bcc extract golden tests (10-run window)
        shell: bash
        run: |
          set -euo pipefail
          durations=()
          for i in $(seq 1 10); do
            echo "extract_golden run ${i}/10"
            start=$(date +%s)
            cargo test -p bcc --test extract_golden
            end=$(date +%s)
            duration=$((end - start))
            durations+=("${duration}")
            echo "extract_golden duration[${i}]=${duration}s"
          done

          sorted=($(printf '%s\n' "${durations[@]}" | sort -n))
          index=$(( (95 * ${#sorted[@]} + 99) / 100 - 1 ))
          if [ "${index}" -lt 0 ]; then
            index=0
          fi
          p95="${sorted[${index}]}"
          echo "extract_golden durations: ${durations[*]}"
          echo "extract_golden p95: ${p95}s (threshold: 90s)"
          if [ "${p95}" -gt 90 ]; then
            echo "::warning title=bcc extract golden tests::P95 ${p95}s > 90s, split to dedicated CI job."
          fi

  bddc:
    name: bddc test (ubuntu)
    runs-on: ubuntu-latest
    needs: bot-label-guard
    defaults:
      run:
        working-directory: compiler/bddc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            compiler/bddc/deps
            compiler/bddc/_build
          key: bddc-${{ runner.os }}-mix-${{ hashFiles('compiler/bddc/mix.exs') }}
          restore-keys: bddc-${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Build escript
        run: mix escript.build

      - name: Verify escript help
        run: ./bdd_compiler --help

  build-matrix:
    name: taskctl+bcc build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: bot-label-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
          - label: darwin-arm64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build all workspace members
        run: cargo build --release

      - name: Verify taskctl
        run: ./target/release/taskctl --help

      - name: Verify bcc
        run: ./target/release/bcc --help
