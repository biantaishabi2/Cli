name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  taskctl:
    name: taskctl test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestration/taskctl

      - name: Run tests
        run: cargo test --manifest-path orchestration/taskctl/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path orchestration/taskctl/Cargo.toml

      - name: Verify binary help
        run: ./orchestration/taskctl/target/release/taskctl --help

  bddc:
    name: bddc test (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler/bddc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            compiler/bddc/deps
            compiler/bddc/_build
          key: bddc-${{ runner.os }}-mix-${{ hashFiles('compiler/bddc/mix.exs') }}
          restore-keys: bddc-${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Build escript
        run: mix escript.build

      - name: Verify escript help
        run: ./bdd_compiler --help

  build-matrix:
    name: taskctl build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
          - label: darwin-arm64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestration/taskctl

      - name: Build release binary
        run: cargo build --release --manifest-path orchestration/taskctl/Cargo.toml

      - name: Verify binary help
        run: ./orchestration/taskctl/target/release/taskctl --help
