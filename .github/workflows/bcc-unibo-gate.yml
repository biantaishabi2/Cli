name: BCC UniBO Gate

on:
  pull_request:
    paths:
      - 'compiler/bcc/**'
      - '.github/workflows/bcc-unibo-gate.yml'
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - 'v*'
    paths:
      - 'compiler/bcc/**'
      - '.github/workflows/bcc-unibo-gate.yml'

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bcc-unibo-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve gate mode
        id: gate_mode
        shell: bash
        run: |
          set -euo pipefail
          MODE="warn"
          if [[ "${GITHUB_REF}" == refs/heads/release/* || "${GITHUB_REF}" == refs/tags/* ]]; then
            MODE="strict"
          fi

          echo "gate_mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "GATE_MODE=${MODE}" >> "$GITHUB_ENV"

          if [[ "${MODE}" == "strict" ]]; then
            echo "GATE_FAIL_ON_DANGEROUS=true" >> "$GITHUB_ENV"
          else
            echo "GATE_FAIL_ON_DANGEROUS=false" >> "$GITHUB_ENV"
          fi

      - name: Enforce baseline/whitelist governance
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const governedFiles = new Set([
              "compiler/bcc/tests/fixtures/contracts/baseline_manifest.json",
              "compiler/bcc/tests/fixtures/contracts/whitelist.toml",
            ]);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const touched = files
              .map((item) => item.filename)
              .filter((name) => governedFiles.has(name));

            if (touched.length === 0) {
              core.info("baseline/whitelist 未变更，跳过治理校验");
              return;
            }

            core.notice(`检测到治理文件变更: ${touched.join(", ")}`);

            const prBody = context.payload.pull_request.body || "";
            const hasScope = /(baseline|whitelist|基线|白名单)/i.test(prBody);
            const hasReason = /(reason|原因|governance|治理)/i.test(prBody);
            if (!(hasScope && hasReason)) {
              core.setFailed(
                "baseline/whitelist 变更必须在 PR 描述中写明治理原因（需包含 baseline/whitelist 与 reason/原因 关键词）"
              );
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const latestStateByUser = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) {
                continue;
              }
              latestStateByUser.set(login, review.state);
            }

            const approvers = [...latestStateByUser.entries()]
              .filter(([, state]) => state === "APPROVED")
              .map(([login]) => login);

            if (approvers.length === 0) {
              core.setFailed(
                "baseline/whitelist 变更至少需要 1 个 APPROVED review 才允许通过门禁"
              );
              return;
            }

            const loadCodeowners = async () => {
              const candidates = [".github/CODEOWNERS", "CODEOWNERS", "docs/CODEOWNERS"];
              for (const path of candidates) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path,
                    ref: context.payload.pull_request.head.sha,
                  });
                  if (!("content" in response.data) || !response.data.content) {
                    continue;
                  }
                  const raw = Buffer.from(
                    response.data.content,
                    response.data.encoding || "base64"
                  ).toString("utf8");
                  return { path, raw };
                } catch (error) {
                  if (error.status === 404) {
                    continue;
                  }
                  throw error;
                }
              }
              return null;
            };

            const globToRegExp = (pattern) => {
              const anchored = pattern.startsWith("/");
              let normalized = pattern.replace(/^\/+/, "");
              if (normalized.endsWith("/")) {
                normalized = `${normalized}**`;
              }
              const escaped = normalized.replace(/[.+^${}()|[\]\\]/g, "\\$&");
              const regexBody = escaped
                .replace(/\*\*/g, "___DOUBLE_STAR___")
                .replace(/\*/g, "[^/]*")
                .replace(/\?/g, "[^/]")
                .replace(/___DOUBLE_STAR___/g, ".*");
              if (anchored) {
                return new RegExp(`^${regexBody}$`);
              }
              return new RegExp(`(^|.*/)${regexBody}$`);
            };

            const parseCodeowners = (raw) =>
              raw
                .split(/\r?\n/)
                .map((line) => line.replace(/\s+#.*$/, "").trim())
                .filter((line) => line && !line.startsWith("#") && !line.startsWith("["))
                .map((line) => line.split(/\s+/).filter(Boolean))
                .filter((parts) => parts.length >= 2)
                .map((parts) => ({
                  pattern: parts[0],
                  owners: parts.slice(1).filter((owner) => owner.startsWith("@")),
                }))
                .filter((entry) => entry.owners.length > 0)
                .map((entry) => ({
                  ...entry,
                  regex: globToRegExp(entry.pattern),
                }));

            const resolveOwnersForPath = (entries, filePath) => {
              let matched = null;
              for (const entry of entries) {
                if (entry.regex.test(filePath)) {
                  matched = entry;
                }
              }
              return matched ? matched.owners : [];
            };

            const codeowners = await loadCodeowners();
            if (!codeowners) {
              core.setFailed(
                "baseline/whitelist 变更需要 CODEOWNERS 审批，但仓库未找到 CODEOWNERS 文件（.github/CODEOWNERS/CODEOWNERS/docs/CODEOWNERS）"
              );
              return;
            }

            const codeownerEntries = parseCodeowners(codeowners.raw);
            if (codeownerEntries.length === 0) {
              core.setFailed(
                `baseline/whitelist 变更需要 CODEOWNERS 审批，但 ${codeowners.path} 无有效 owner 规则`
              );
              return;
            }

            const requiredOwners = new Set();
            const unmappedFiles = [];
            for (const file of touched) {
              const owners = resolveOwnersForPath(codeownerEntries, file);
              if (owners.length === 0) {
                unmappedFiles.push(file);
                continue;
              }
              for (const ownerName of owners) {
                requiredOwners.add(ownerName.toLowerCase());
              }
            }

            if (unmappedFiles.length > 0) {
              core.setFailed(
                `治理文件未匹配到 CODEOWNERS owner，请补充规则: ${unmappedFiles.join(", ")}`
              );
              return;
            }

            const approverHandles = new Set(
              approvers.map((login) => `@${login.toLowerCase()}`)
            );
            const matchedCodeowners = [...requiredOwners].filter((ownerName) =>
              approverHandles.has(ownerName)
            );
            if (matchedCodeowners.length === 0) {
              core.setFailed(
                `治理文件变更需要 CODEOWNERS 审批。required=${[...requiredOwners].join(", ")} approvers=${approvers.join(", ")}`
              );
              return;
            }

            core.info(
              `治理审批通过，approvers: ${approvers.join(", ")}，codeowners: ${matchedCodeowners.join(", ")}`
            );

      - name: Run BCC + UniBO gate regression
        run: |
          echo "GATE_MODE=${GATE_MODE}"
          echo "GATE_FAIL_ON_DANGEROUS=${GATE_FAIL_ON_DANGEROUS}"
          cargo test -p bcc \
            --test contract_manifest_drift \
            --test integration_bcc_unibo_runtime \
            --test regression_l0_l3_evolution

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcc-unibo-gate-reports-${{ steps.gate_mode.outputs.gate_mode }}
          path: target/gate-reports/*.json
          if-no-files-found: warn
