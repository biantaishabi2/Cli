name: niuma - Review Reusable

on:
  workflow_call:
    inputs:
      repo:
        description: "目标仓库（owner/repo）"
        required: true
        type: string
      issue_number:
        description: "Issue 编号"
        required: true
        type: string
      skip_test_gate:
        description: "跳过 test gate（外部仓库无 niuma-test-gate.sh 时设为 true）"
        required: false
        default: false
        type: boolean
      workflow_source_repo:
        description: "reusable workflow 源仓库（owner/repo）"
        required: false
        default: ""
        type: string
      workflow_source_ref:
        description: "reusable workflow 源 ref（分支、tag 或 SHA）"
        required: false
        default: ""
        type: string
      repo_dir:
        description: "仓库目录（相对 GITHUB_WORKSPACE 或绝对路径）"
        required: false
        default: "."
        type: string
      build_niuma:
        description: "是否在当前提交构建 niuma"
        required: false
        default: true
        type: boolean

permissions:
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: self-hosted
    concurrency:
      group: niuma-review-${{ inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build niuma from current commit
        if: inputs.build_niuma
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          (
            cd automation/niuma
            go build -o "$GITHUB_WORKSPACE/.tmp/niuma" ./cmd/niuma
          )
          echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"

      - name: Resolve niuma binary
        run: |
          if [ -n "${NIUMA_BIN:-}" ]; then
            exit 0
          fi
          if [ "${{ inputs.build_niuma }}" = "true" ]; then
            echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"
            exit 0
          fi
          niuma_path="$(command -v niuma || true)"
          if [ -z "$niuma_path" ]; then
            echo "::error::build_niuma=false 但未找到预装 niuma 二进制"
            exit 1
          fi
          echo "NIUMA_BIN=$niuma_path" >> "$GITHUB_ENV"

      - name: Find PR Number
        id: find_pr
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ inputs.repo }}
        run: |
          # 分页解析 BOT:PR_CREATED marker，取最新 open PR 号
          if PR_NUMBER=$("$NIUMA_BIN" resolve-pr --repo "$REPO" --issue "$ISSUE_NUMBER"); then
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "::warning::未在 issue #${ISSUE_NUMBER} 的评论中找到可用 PR 号"
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Run PR Gate
        id: pr_gate
        if: "!inputs.skip_test_gate && steps.find_pr.outputs.pr_number != ''"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          ./.github/scripts/niuma-test-gate.sh "$PR_NUMBER"

      - name: Restore Workspace After Gate
        if: "!inputs.skip_test_gate && steps.find_pr.outputs.pr_number != ''"
        run: |
          git checkout --force "$GITHUB_SHA"

      - name: Gate Failed -> Transition to PR Needs Fix
        if: "!inputs.skip_test_gate && steps.find_pr.outputs.pr_number != '' && steps.pr_gate.outcome == 'failure'"
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          REPO: ${{ inputs.repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          "$NIUMA_BIN" state-label set \
            --repo "$REPO" \
            --issue "$ISSUE_NUMBER" \
            --from bot:pr-created \
            --to bot:pr-needs-fix

      - name: AI Self-Review
        if: steps.find_pr.outputs.pr_number != '' && (inputs.skip_test_gate || steps.pr_gate.outcome == 'success')
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          NIUMA_IMPLEMENTATION_PROVIDER: codex
          REPO: ${{ inputs.repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          "$NIUMA_BIN" review \
            --repo "$REPO" \
            --issue "$ISSUE_NUMBER" \
            --pr "$PR_NUMBER"
