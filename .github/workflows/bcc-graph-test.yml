name: BCC Graph Tests

on:
  push:
    branches: [master, feat/68-graph-enhancement]
    paths:
      - 'compiler/bcc/src/graph/**'
      - 'compiler/bcc/tests/graph_*.rs'
  pull_request:
    branches: [master]
    paths:
      - 'compiler/bcc/src/graph/**'
      - 'compiler/bcc/tests/graph_*.rs'

env:
  CARGO_TERM_COLOR: always

jobs:
  # 单元测试（PR 和 master 都跑）
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test -p bcc graph:: --lib

  # 集成测试（PR 和 master 都跑）
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Run integration tests
        run: cargo test -p bcc --test graph_integration

  # BDD 测试（只在 master 跑）
  bdd-tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Run BDD tests
        run: cargo test -p bcc --test graph_bdd --features bdd

  # E2E 测试（手动触发）
  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Clone test repos
        run: |
          git clone --depth 1 https://github.com/HKUDS/nanobot.git /tmp/nanobot

      - name: Run E2E tests
        run: cargo test -p bcc --test graph_e2e
        env:
          E2E_TEST_REPO: /tmp/nanobot
