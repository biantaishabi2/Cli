name: niuma - Build

on:
  push:
    branches: [master]
    paths:
      - 'automation/niuma/**'
      - 'orchestration/taskctl/**'

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build niuma
        working-directory: automation/niuma
        run: go build -o niuma ./cmd/niuma

      - name: Install niuma
        run: |
          sudo cp automation/niuma/niuma /usr/local/bin/niuma
          sudo chmod +x /usr/local/bin/niuma
          niuma --help

      - name: Build taskctl
        run: cargo build --release -p taskctl

      - name: Install taskctl
        run: |
          sudo cp target/release/taskctl /usr/local/bin/taskctl
          sudo chmod +x /usr/local/bin/taskctl
          taskctl --help
