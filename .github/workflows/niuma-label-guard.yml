name: niuma - Label Guard

on:
  issues:
    types: [labeled, unlabeled]

jobs:
  guard:
    runs-on: self-hosted
    if: startsWith(github.event.label.name, 'bot:')
    concurrency:
      group: niuma-label-guard-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NIUMA_PAT || github.token }}

      - name: Build niuma from current commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          (
            cd automation/niuma
            go build -o "$GITHUB_WORKSPACE/.tmp/niuma" ./cmd/niuma
          )
          echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"

      - name: Run label guard
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          "$NIUMA_BIN" label-guard \
            --repo "$REPO" \
            --issue "$ISSUE_NUMBER" \
            --actor "$ACTOR" \
            --action "$ACTION" \
            --label "$LABEL"
