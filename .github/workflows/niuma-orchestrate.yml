name: niuma - Orchestrate

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  repository_dispatch:
    types: [niuma.task.completed]
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟检查一次

concurrency:
  group: niuma-orchestrate-${{ github.event.issue.number || github.event.client_payload.source_issue || github.event.pull_request.number || github.event.client_payload.trigger_pr || github.event_name }}
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: self-hosted
    if: >
      (github.event_name == 'issues' && (github.event.label.name == 'bot:orchestrate' || github.event.label.name == 'bot:queued' || github.event.label.name == 'bot:pr-reviewable')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'niuma.task.completed' && github.event.client_payload.event_source == 'close-after-integration-merge') ||
      github.event_name == 'schedule'
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NIUMA_PAT }}

      - name: Resolve Trigger Context
        id: trigger_context
        run: |
          trigger_source="${GITHUB_EVENT_NAME}"
          issue=""
          event_id="${{ github.event.client_payload.event_id }}"

          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            trigger_source="issues:${{ github.event.label.name }}"
            issue="${{ github.event.issue.number }}"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            trigger_source="pull_request:${{ github.event.action }}"
            issue="${{ github.event.pull_request.number }}"
          elif [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            payload_source="${{ github.event.client_payload.event_source }}"
            if [ -n "$payload_source" ]; then
              trigger_source="repository_dispatch:${payload_source}"
            else
              trigger_source="repository_dispatch:${{ github.event.action }}"
            fi
            issue="${{ github.event.client_payload.source_issue }}"
            if [ -z "$issue" ]; then
              issue="${{ github.event.client_payload.trigger_pr }}"
            fi
          fi

          if [ -z "$issue" ]; then
            issue="schedule"
          fi
          if [ -z "$event_id" ]; then
            event_id="run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          fi

          triggered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "trigger_source=$trigger_source" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "event_id=$event_id" >> "$GITHUB_OUTPUT"
          echo "triggered_at=$triggered_at" >> "$GITHUB_OUTPUT"
          printf '[orchestrate.trigger] {"trigger_source":"%s","issue":"%s","event_id":"%s","triggered_at":"%s"}\n' \
            "$trigger_source" "$issue" "$event_id" "$triggered_at"

      - name: Build niuma from current commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          (
            cd automation/niuma
            go build -o "$GITHUB_WORKSPACE/.tmp/niuma" ./cmd/niuma
          )
          echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"

      - name: Run Orchestration
        id: control_run
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          NIUMA_INTEGRATION_GATE_MAX_RETRIES: ${{ vars.NIUMA_INTEGRATION_GATE_MAX_RETRIES || '2' }}
          NIUMA_PR_CONFLICT_RETRY_THRESHOLD: ${{ vars.NIUMA_PR_CONFLICT_RETRY_THRESHOLD || '3' }}
          NIUMA_PR_CONFLICT_UNKNOWN_BACKOFFS: ${{ vars.NIUMA_PR_CONFLICT_UNKNOWN_BACKOFFS || '5s,15s,30s' }}
        run: |
          "$NIUMA_BIN" control run \
            --repo "$REPO" \
            --repo-dir "$WORKSPACE" \
            --integration-gate-max-retries "$NIUMA_INTEGRATION_GATE_MAX_RETRIES" \
            --pr-conflict-retry-threshold "$NIUMA_PR_CONFLICT_RETRY_THRESHOLD" \
            --pr-conflict-unknown-backoffs "$NIUMA_PR_CONFLICT_UNKNOWN_BACKOFFS"

      - name: Collect Integration Gate Status
        id: gate_status
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          STORE_PATH="$WORKSPACE/.niuma/tasks.json"
          if [ ! -f "$STORE_PATH" ]; then
            echo "integration_gate_status=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(jq -r '
            [ (.tasks // {}) | to_entries[] | .value.metadata.integration_gate_status // empty ] as $s |
            if ($s | index("escalated")) then "escalated"
            elif ($s | index("retrying")) then "retrying"
            elif ($s | index("pending")) then "pending"
            elif ($s | index("passed")) then "passed"
            else "passed" end
          ' "$STORE_PATH")
          echo "integration_gate_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "integration_gate_status=$STATUS"

      - name: Gate Passed
        if: steps.gate_status.outputs.integration_gate_status == 'passed'
        run: |
          echo "integration gate 全部通过，继续自动推进。"

      - name: Gate Retrying
        if: steps.gate_status.outputs.integration_gate_status == 'retrying'
        run: |
          echo "integration gate 失败但未超限，进入自动修复分支。"

      - name: Gate Escalated
        if: steps.gate_status.outputs.integration_gate_status == 'escalated'
        run: |
          echo "integration gate 已超限升级人工，终止自动推进。"

      - name: Gate Pending
        if: steps.gate_status.outputs.integration_gate_status == 'pending'
        run: |
          echo "integration gate 仍在等待结果，本轮不推进后续自动流程。"

      - name: Log Orchestrate Result
        if: always()
        run: |
          result="success"
          if [ "${{ steps.control_run.outcome }}" != "success" ]; then
            result="control_failed"
          elif [ -n "${{ steps.gate_status.outputs.integration_gate_status }}" ]; then
            result="gate_${{ steps.gate_status.outputs.integration_gate_status }}"
          fi

          printf '[orchestrate.result] {"trigger_source":"%s","issue":"%s","event_id":"%s","triggered_at":"%s","result":"%s"}\n' \
            "${{ steps.trigger_context.outputs.trigger_source }}" \
            "${{ steps.trigger_context.outputs.issue }}" \
            "${{ steps.trigger_context.outputs.event_id }}" \
            "${{ steps.trigger_context.outputs.triggered_at }}" \
            "$result"

  close-after-integration-merge:
    runs-on: self-hosted
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'integration/')
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NIUMA_PAT }}

      - name: Build niuma from current commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          (
            cd automation/niuma
            go build -o "$GITHUB_WORKSPACE/.tmp/niuma" ./cmd/niuma
          )
          echo "NIUMA_BIN=$GITHUB_WORKSPACE/.tmp/niuma" >> "$GITHUB_ENV"

      - name: Close Sub/Parent Issues After Integration Merge
        id: close_merged
        env:
          GITHUB_TOKEN: ${{ secrets.NIUMA_PAT }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          "$NIUMA_BIN" control close-merged \
            --repo "$REPO" \
            --repo-dir "$WORKSPACE" \
            --pr "$PR_NUMBER" | tee "$output_file"

          source_issues_json="[]"
          source_issue=""
          issues_line="$(grep -Eo '目标 issues: \[[0-9 ]+\]' "$output_file" | tail -n 1 || true)"
          if [ -n "$issues_line" ]; then
            issues_raw="$(echo "$issues_line" | sed -E 's/.*\[([^]]*)\].*/\1/')"
            source_issues_json="$(printf '%s\n' "$issues_raw" | tr ' ' '\n' | sed '/^$/d' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
            source_issue="$(echo "$source_issues_json" | jq -r '.[0] // ""')"
          fi

          echo "source_issue=$source_issue" >> "$GITHUB_OUTPUT"
          echo "source_issues=$source_issues_json" >> "$GITHUB_OUTPUT"

      - name: Dispatch orchestrate wakeup
        id: dispatch_orchestrate_wakeup
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.NIUMA_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_ISSUE: ${{ steps.close_merged.outputs.source_issue }}
          SOURCE_ISSUES: ${{ steps.close_merged.outputs.source_issues }}
        run: |
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          event_id="pr-${PR_NUMBER}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_issues_json="$SOURCE_ISSUES"
          if [ -z "$source_issues_json" ]; then
            source_issues_json="[]"
          fi

          request_payload="$(jq -nc \
            --arg source_issue "$SOURCE_ISSUE" \
            --arg source_issues "$source_issues_json" \
            --arg trigger_pr "$PR_NUMBER" \
            --arg completed_at "$completed_at" \
            --arg event_id "$event_id" \
            '{
              event_type: "niuma.task.completed",
              client_payload: {
                source_issue: (if ($source_issue | length) > 0 then ($source_issue | tonumber) else null end),
                source_issues: (($source_issues | fromjson) // []),
                trigger_pr: ($trigger_pr | tonumber),
                completed_at: $completed_at,
                event_source: "close-after-integration-merge",
                event_id: $event_id
              }
            }'
          )"

          gh api "repos/$REPO/dispatches" --method POST --input - <<<"$request_payload"
          printf '[orchestrate.dispatch] {"trigger_source":"close-after-integration-merge","issue":"%s","event_id":"%s","triggered_at":"%s","result":"dispatched"}\n' \
            "${SOURCE_ISSUE:-$PR_NUMBER}" "$event_id" "$completed_at"

      - name: Warn Dispatch Failure
        if: steps.dispatch_orchestrate_wakeup.outcome != 'success'
        run: |
          echo "::warning title=orchestrate dispatch failed::niuma.task.completed dispatch failed for PR #${{ github.event.pull_request.number }}; schedule fallback remains active."
