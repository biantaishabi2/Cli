name: niuma bot

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分钟检查一次

defaults:
  run:
    working-directory: automation/niuma

# 同一 issue 只跑一个 workflow
concurrency:
  group: niuma-${{ github.event.issue.number || github.event.pull_request.number || 'schedule' }}
  cancel-in-progress: true

jobs:
  niuma:
    runs-on: self-hosted
    # 只在 bot:fix label 事件、issue 评论、PR review、或定时触发时运行
    if: >
      (github.event_name == 'issues' && contains(github.event.label.name, 'bot:')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null) ||
      (github.event_name == 'pull_request_review') ||
      (github.event_name == 'schedule')
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: automation/niuma/go.sum

      - name: Build niuma
        run: go build -o niuma ./cmd/niuma

      # Issue 被标记 bot:fix → 生成方案草案
      - name: Plan Draft
        if: >
          github.event_name == 'issues' &&
          github.event.label.name == 'bot:fix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./niuma plan-draft \
            --repo ${{ github.repository }} \
            --issue ${{ github.event.issue.number }}

      # Issue 评论 → 检查讨论收敛
      - name: Discussion Check
        if: >
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只处理有 bot: label 的 issue
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "bot:needs-discussion"; then
            ./niuma plan-final \
              --repo ${{ github.repository }} \
              --issue ${{ github.event.issue.number }} || true
          fi

      # PR review 提交 → 检查是否需要迭代
      - name: Handle PR Review
        if: github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BODY=$(gh pr view $PR_NUMBER --json body -q '.body')
          # 从 PR body 中提取关联的 issue 号
          ISSUE_NUMBER=$(echo "$BODY" | grep -oP 'Closes #\K\d+' | head -1)
          if [ -n "$ISSUE_NUMBER" ]; then
            ./niuma iterate \
              --repo ${{ github.repository }} \
              --issue $ISSUE_NUMBER \
              --pr $PR_NUMBER || true
          fi

      # 定时任务 → 检查所有进行中的 issue
      - name: Scheduled Check
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 查找所有 bot:needs-discussion 的 issue
          ISSUES=$(gh issue list --label "bot:needs-discussion" --json number -q '.[].number')
          for ISSUE in $ISSUES; do
            echo "检查 issue #$ISSUE 讨论收敛..."
            ./niuma plan-final \
              --repo ${{ github.repository }} \
              --issue $ISSUE || true
          done
